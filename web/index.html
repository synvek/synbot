<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synbot</title>
    <!--
      Theme bootstrap: the class has to be on <html> before the first paint, otherwise a dark-mode
      operator gets a white flash on every reload. Kept inline and dependency-free on purpose.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode') || 'light';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-accent', localStorage.getItem('theme-scheme') || 'blue-ocean');
          var language = localStorage.getItem('language') || 'en';
          root.setAttribute('lang', language === 'zh' ? 'zh-CN' : 'en');
        } catch (error) {
          /* private mode without storage: fall back to the defaults in tokens.css */
        }
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/geist-sans-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/geist-mono-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
